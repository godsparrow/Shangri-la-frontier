<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

let gameState = "menu";
let selectedWeapon = null;

const keys = {};
addEventListener("keydown", e => keys[e.key] = true);
addEventListener("keyup", e => keys[e.key] = false);
addEventListener("click", handleClick);

// ================= UTIL =================
function dist(a,b,c,d){ return Math.hypot(a-c,b-d); }

// ================= PLAYER =================
class Player {
    constructor(){
        this.x = canvas.width/2;
        this.y = canvas.height/2;
        this.size = 22;
        this.speed = 4;
        this.hp = 100;
        this.level = 1;
        this.xp = 0;
        this.cooldown = 0;
        this.angle = 0;
    }

    move(){
        if(keys.w||keys.ArrowUp) this.y -= this.speed;
        if(keys.s||keys.ArrowDown) this.y += this.speed;
        if(keys.a||keys.ArrowLeft) this.x -= this.speed;
        if(keys.d||keys.ArrowRight) this.x += this.speed;
    }

    autoAim(){
        let nearest = null;
        let min = Infinity;
        enemies.forEach(e=>{
            const d = dist(this.x,this.y,e.x,e.y);
            if(d < min){ min=d; nearest=e; }
        });
        if(nearest){
            this.angle = Math.atan2(nearest.y-this.y,nearest.x-this.x);
            return nearest;
        }
        return null;
    }

    attack(){
        if(this.cooldown>0) return;
        const target = this.autoAim();
        if(!target) return;

        if(selectedWeapon==="Sword"){
            slashes.push(new Slash(this.x,this.y,this.angle));
            this.cooldown = 20;
        }
        if(selectedWeapon==="Bow"){
            projectiles.push(new Arrow(this.x,this.y,this.angle));
            this.cooldown = 25;
        }
        if(selectedWeapon==="Staff"){
            projectiles.push(new Magic(this.x,this.y,target));
            this.cooldown = 35;
        }
    }

    draw(){
        ctx.save();
        ctx.translate(this.x,this.y);

        // body
        ctx.fillStyle="#00ffff";
        ctx.beginPath();
        ctx.arc(0,5,10,0,Math.PI*2);
        ctx.fill();

        // head
        ctx.fillStyle="#e0ffff";
        ctx.beginPath();
        ctx.arc(0,-10,6,0,Math.PI*2);
        ctx.fill();

        // cloak
        ctx.fillStyle="#0088aa";
        ctx.beginPath();
        ctx.moveTo(-12,8);
        ctx.lineTo(12,8);
        ctx.lineTo(0,30);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }
}

const player = new Player();

// ================= ENEMY =================
class Enemy {
    constructor(){
        this.x = Math.random()*canvas.width;
        this.y = Math.random()*canvas.height;
        this.size = 18;
        this.hp = 40;
    }
    update(){
        const a = Math.atan2(player.y-this.y,player.x-this.x);
        this.x += Math.cos(a)*1.3;
        this.y += Math.sin(a)*1.3;
        if(dist(this.x,this.y,player.x,player.y)<20) player.hp-=0.2;
    }
    draw(){
        ctx.fillStyle="#ff4444";
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
        ctx.fill();
    }
}

let enemies=[];
for(let i=0;i<6;i++) enemies.push(new Enemy());

// ================= SLASH =================
class Slash {
    constructor(x,y,angle){
        this.x=x;
        this.y=y;
        this.angle=angle;
        this.life=12;
    }
    update(){ this.life--; }
    draw(){
        ctx.strokeStyle="white";
        ctx.lineWidth=6;
        ctx.beginPath();
        ctx.arc(
            this.x,
            this.y,
            50,
            this.angle-0.8+(12-this.life)*0.05,
            this.angle+0.8+(12-this.life)*0.05
        );
        ctx.stroke();
    }
}

let slashes=[];

// ================= PROJECTILES =================
class Arrow {
    constructor(x,y,a){
        this.x=x;
        this.y=y;
        this.vx=Math.cos(a)*8;
        this.vy=Math.sin(a)*8;
    }
    update(){ this.x+=this.vx; this.y+=this.vy; }
    draw(){
        ctx.strokeStyle="yellow";
        ctx.beginPath();
        ctx.moveTo(this.x,this.y);
        ctx.lineTo(this.x-this.vx*2,this.y-this.vy*2);
        ctx.stroke();
    }
}

class Magic {
    constructor(x,y,target){
        this.x=x;
        this.y=y;
        this.target=target;
    }
    update(){
        const a=Math.atan2(this.target.y-this.y,this.target.x-this.x);
        this.x+=Math.cos(a)*4;
        this.y+=Math.sin(a)*4;
    }
    draw(){
        ctx.fillStyle="#aa00ff";
        ctx.beginPath();
        ctx.arc(this.x,this.y,6,0,Math.PI*2);
        ctx.fill();
    }
}

let projectiles=[];

// ================= MENU =================
const weapons=["Sword","Bow","Staff"];

function handleClick(e){
    if(gameState==="weapon"){
        weapons.forEach((w,i)=>{
            if(e.clientX>canvas.width/2-150 &&
               e.clientX<canvas.width/2+150 &&
               e.clientY>250+i*90 &&
               e.clientY<310+i*90){
                selectedWeapon=w;
                gameState="play";
            }
        });
    }
}

function drawMenu(){
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#00ffff";
    ctx.font="60px monospace";
    ctx.textAlign="center";
    ctx.fillText("RPG",canvas.width/2,canvas.height/2);
    ctx.font="25px monospace";
    ctx.fillText("Press ENTER",canvas.width/2,canvas.height/2+40);
    if(keys.Enter) gameState="weapon";
}

function drawWeapon(){
    ctx.fillStyle="#111";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="white";
    ctx.font="40px monospace";
    ctx.fillText("Choose Weapon",canvas.width/2,150);
    weapons.forEach((w,i)=>{
        ctx.fillStyle="#00ffff";
        ctx.fillRect(canvas.width/2-150,250+i*90,300,60);
        ctx.fillStyle="black";
        ctx.fillText(w,canvas.width/2,290+i*90);
    });
}

// ================= LOOP =================
function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(gameState==="menu") drawMenu();
    else if(gameState==="weapon") drawWeapon();
    else if(gameState==="play"){
        player.move();
        if(keys[" "]) player.attack();
        if(player.cooldown>0) player.cooldown--;

        player.draw();

        enemies.forEach((e,ei)=>{
            e.update();
            e.draw();
            slashes.forEach(s=>{
                if(dist(e.x,e.y,s.x,s.y)<50) e.hp-=3;
            });
            projectiles.forEach((p,pi)=>{
                if(dist(e.x,e.y,p.x,p.y)<18){
                    e.hp-=10;
                    projectiles.splice(pi,1);
                }
            });
            if(e.hp<=0){
                enemies.splice(ei,1);
                enemies.push(new Enemy());
            }
        });

        slashes.forEach((s,i)=>{ s.update(); s.draw(); if(s.life<=0) slashes.splice(i,1); });
        projectiles.forEach((p,i)=>{ p.update(); p.draw(); });

    }

    requestAnimationFrame(loop);
}
loop();
</script>
