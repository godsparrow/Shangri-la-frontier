<script>
// ================= CANVAS =================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ================= STATE =================
let gameState = "menu";
let selectedWeapon = "Sword";

// ================= INPUT =================
const keys = {};
window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

// ================= UTIL =================
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

// ================= PLAYER =================
class Player {
    constructor(){
        this.x = canvas.width/2;
        this.y = canvas.height/2;
        this.hp = 100;
        this.level = 1;
        this.xp = 0;
        this.speed = 3.5;
        this.attackCooldown = 0;
    }

    move(){
        if(keys.w) this.y -= this.speed;
        if(keys.s) this.y += this.speed;
        if(keys.a) this.x -= this.speed;
        if(keys.d) this.x += this.speed;
    }

    draw(){
        // ---- cloak ----
        ctx.fillStyle = "#1e2a44";
        ctx.beginPath();
        ctx.arc(this.x, this.y+8, 22, Math.PI, 0);
        ctx.fill();

        // ---- body ----
        ctx.fillStyle = "#2ee6d6";
        ctx.fillRect(this.x-8, this.y, 16, 18);

        // ---- head ----
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(this.x, this.y-6, 8, 0, Math.PI*2);
        ctx.fill();

        // ---- eyes ----
        ctx.fillStyle = "#000";
        ctx.fillRect(this.x-3, this.y-7, 2, 2);
        ctx.fillRect(this.x+1, this.y-7, 2, 2);
    }

    gainXP(x){
        this.xp += x;
        if(this.xp >= this.level*40){
            this.xp = 0;
            this.level++;
            this.hp += 20;
        }
    }

    attack(){
        if(this.attackCooldown > 0) return;

        const target = getNearestEnemy();
        if(!target) return;

        slashes.push(new Slash(this, target));
        this.attackCooldown = 25;
    }
}

const player = new Player();

// ================= ENEMY =================
class Enemy {
    constructor(){
        this.x = Math.random()*canvas.width;
        this.y = Math.random()*canvas.height;
        this.hp = 50;
        this.size = 20;
    }

    update(){
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const d = Math.hypot(dx,dy);
        this.x += dx/d * 1.2;
        this.y += dy/d * 1.2;

        if(d < 22) player.hp -= 0.15;
    }

    draw(){
        ctx.fillStyle = "#ff4b4b";
        ctx.fillRect(this.x-this.size/2, this.y-this.size/2, this.size, this.size);
    }
}

let enemies = Array.from({length:6}, ()=>new Enemy());

// ================= AUTO AIM =================
function getNearestEnemy(){
    let closest = null;
    let min = Infinity;
    enemies.forEach(e=>{
        const d = dist(player,e);
        if(d < min){
            min = d;
            closest = e;
        }
    });
    return closest;
}

// ================= SLASH =================
class Slash {
    constructor(player, enemy){
        this.cx = player.x;
        this.cy = player.y;
        this.angle = Math.atan2(enemy.y-player.y, enemy.x-player.x);
        this.life = 12;
        this.hit = false;
    }

    update(){
        this.life--;
        const arcAngle = this.angle - 0.8 + (12-this.life)*0.13;

        enemies.forEach((e,i)=>{
            if(!this.hit && dist({x:this.cx,y:this.cy}, e) < 45){
                e.hp -= 35;
                this.hit = true;
                if(e.hp <= 0){
                    enemies.splice(i,1);
                    enemies.push(new Enemy());
                    player.gainXP(20);
                }
            }
        });

        this.arcAngle = arcAngle;
    }

    draw(){
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(this.cx, this.cy, 40, this.arcAngle, this.arcAngle+0.8);
        ctx.stroke();
        ctx.lineWidth = 1;
    }
}

let slashes = [];

// ================= UI =================
function drawUI(){
    ctx.fillStyle = "#fff";
    ctx.font = "14px monospace";
    ctx.fillText(`HP:${Math.floor(player.hp)} LV:${player.level} XP:${player.xp}`, 10, 20);
}

// ================= LOOP =================
function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#0b1020";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    player.move();
    if(keys[" "]) player.attack();
    if(player.attackCooldown>0) player.attackCooldown--;

    player.draw();

    enemies.forEach(e=>{ e.update(); e.draw(); });

    slashes.forEach((s,i)=>{
        s.update();
        s.draw();
        if(s.life<=0) slashes.splice(i,1);
    });

    drawUI();

    if(player.hp<=0){
        ctx.fillStyle="red";
        ctx.font="48px monospace";
        ctx.fillText("GAME OVER", canvas.width/2-140, canvas.height/2);
        return;
    }

    requestAnimationFrame(loop);
}

loop();
</script>
